name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm, macos-26, ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Compute node modules cache key
        id: nodeModulesCacheKey
        run: echo "value=$(node packages/build/src/computeNodeModulesCacheKey.js)" >> $GITHUB_OUTPUT
        shell: bash
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-cacheNodeModules-${{ steps.nodeModulesCacheKey.outputs.value }}
      - name: npm ci
        run: npm ci
        if: steps.npm-cache.outputs.cache-hit != 'true'
      - run: npm test
      - name: Test authentication popup tabs in Electron
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a npm run test:auth-popup
      - name: Test browser capture recovery in Electron
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a npm run test:browser-capture
      - name: Test browser visibility after overlays in Electron
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a npm run test:browser-visibility
      - name: Test native browser view restoration in Electron
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a npm run test:browser-restore
      - name: Test password form isolation in Electron
        if: matrix.os == 'ubuntu-24.04'
        run: xvfb-run -a npm run test:browser-passwords
      - name: Test password persistence with an isolated OS keyring
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gnome-keyring dbus-x11
          xvfb-run -a npm run test:password-storage
      - name: Test native Wayland window startup
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes weston
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          export WAYLAND_DISPLAY=wayland-startup
          unset DISPLAY
          weston --backend=headless-backend.so --renderer=pixman --socket="$WAYLAND_DISPLAY" --idle-time=0 > "$RUNNER_TEMP/weston-startup.log" 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true; cat "$RUNNER_TEMP/weston-startup.log"; rm -rf "$XDG_RUNTIME_DIR"' EXIT
          for attempt in {1..30}; do
            if test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"; then break; fi
            sleep 1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          node scripts/test-window-startup.mjs --ozone-platform=wayland --disable-gpu
      - run: npm run type-check
      - run: npm run lint
      - name: Build
        run: npm run build
